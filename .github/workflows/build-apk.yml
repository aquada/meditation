name: Build APK

on:
  push:
    branches:
      - main
      - 'feature/**'
  workflow_dispatch: {}

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          # pinned to match this project's Android/Gradle toolchain (Gradle 8.4,
          # AGP 8.3.2) rather than tracking current "stable", whose minimum
          # Gradle/AGP requirements have moved well past what this repo targets
          flutter-version: '3.24.5'
          channel: 'stable'

      - run: flutter pub get

      - run: flutter build apk --release --split-per-abi

      - uses: actions/upload-artifact@v4
        with:
          name: meditation-apks
          path: |
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
            build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk
            build/app/outputs/flutter-apk/app-x86_64-release.apk
